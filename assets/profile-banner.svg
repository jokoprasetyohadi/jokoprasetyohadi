<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Joko Prasetyo Hadi — Full-stack developer and product builder</title>
  <desc id="desc">A dark editorial banner with mint accents and three abstract layers representing web, API, and production systems.</desc>
  <defs>
