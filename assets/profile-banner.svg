  <text x="53" y="254" fill="#B6C8CD" font-family="Arial, Helvetica, sans-serif" font-size="20">Web products. Developer APIs. Production systems.</text>
  <text x="53" y="307" fill="#8CF6CB" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">OWNER OF VEVIOZ</text>
